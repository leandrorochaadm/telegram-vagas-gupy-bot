name: Vagas Bot

on:
  # Main schedule lives in the workana-telegram-bot repo (scheduler/src/index.js):
  # a Cloudflare Worker calls workflow_dispatch on time, since GitHub's own
  # schedule is delayed/dropped.
  # This sparse cron is only a fallback in case the Worker stops (e.g. expired
  # token); extra runs are harmless because sent jobs are deduplicated in the db.
  schedule:
    - cron: '23 12,16,20 * * *'   # Reserva: 9h23, 13h23 e 17h23 (BRT), todo dia
  workflow_dispatch:              # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

# Avoid two runs overlapping and racing on the vagas_gupy.db push
concurrency:
  group: vagas-bot
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conectar Cloudflare WARP
        # ProgramaThor's Cloudflare blocks GitHub's datacenter IPs (403). wgcf registers a free
        # WARP account and wireproxy exposes it as a local SOCKS proxy (userspace, no apt:
        # installing the official cloudflare-warp package hangs on the runners).
        # Only the ProgramaThor requests use it. If it fails the bot still runs without a proxy.
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set -x
          cd "$RUNNER_TEMP"
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64
          curl -fsSL https://github.com/whyvl/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz | tar -xz wireproxy
          chmod +x wgcf wireproxy
          ./wgcf register --accept-tos
          ./wgcf generate
          printf 'WGConfig = %s/wgcf-profile.conf\n\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' "$PWD" > wireproxy.conf
          nohup ./wireproxy -c wireproxy.conf > wireproxy.log 2>&1 &
          trace=$(timeout 30 bash -c 'until curl -fsS --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace; do sleep 1; done') \
            || { cat wireproxy.log; exit 1; }
          grep -E '^(ip|warp)=' <<<"$trace"
          grep -qx 'warp=on' <<<"$trace"
          echo "SCRAPER_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py

      - name: Salvar banco de dados atualizado
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Vagas Bot"
          git add vagas_gupy.db
          git diff --staged --quiet || git commit -m "chore: atualiza vagas_gupy.db [skip ci]"
          # Pick up commits pushed to main while the bot was running, otherwise the push is rejected
          git pull --rebase
          git push
