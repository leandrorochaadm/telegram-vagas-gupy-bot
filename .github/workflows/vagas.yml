name: Vagas Bot

on:
  # Main schedule lives in the workana-telegram-bot repo (scheduler/src/index.js):
  # a Cloudflare Worker calls workflow_dispatch on time, since GitHub's own
  # schedule is delayed/dropped.
  # This sparse cron is only a fallback in case the Worker stops (e.g. expired
  # token); extra runs are harmless because sent jobs are deduplicated in the db.
  schedule:
    - cron: '23 12,16,20 * * *'   # Reserva: 9h23, 13h23 e 17h23 (BRT), todo dia
  workflow_dispatch:              # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

# Avoid two runs overlapping and racing on the vagas_gupy.db push
concurrency:
  group: vagas-bot
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conectar Cloudflare WARP
        # ProgramaThor's Cloudflare blocks GitHub's datacenter IPs (403); WARP's proxy mode
        # routes only the ProgramaThor requests through a consumer IP.
        # If it fails the bot still runs without a proxy.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -x
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # Refresh only the WARP repo: a full apt update alone can eat most of the step budget.
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist=sources.list.d/cloudflare-client.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cloudflare-warp
          timeout 30 bash -c 'until warp-cli --accept-tos status >/dev/null 2>&1; do sleep 1; done'
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          timeout 45 bash -c 'until warp-cli --accept-tos status | grep -q Connected; do sleep 1; done' \
            || { warp-cli --accept-tos status; exit 1; }
          trace=$(curl -fsS --max-time 15 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace)
          grep -E '^(ip|warp)=' <<<"$trace"
          grep -qx 'warp=on' <<<"$trace"
          echo "SCRAPER_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python main.py

      - name: Salvar banco de dados atualizado
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Vagas Bot"
          git add vagas_gupy.db
          git diff --staged --quiet || git commit -m "chore: atualiza vagas_gupy.db [skip ci]"
          # Pick up commits pushed to main while the bot was running, otherwise the push is rejected
          git pull --rebase
          git push
