name: Vagas Bot

on:
  schedule:
    # Minutes off the top of the hour: GitHub delays/drops runs scheduled at :00
    - cron: '7,37 11-23 * * 1-5'  # Seg-Sex: a cada 30 min, 8h07 às 20h37 (BRT)
    - cron: '7 13-21 * * 0,6'     # Sáb-Dom: a cada 1h, 10h07 às 18h07 (BRT)
  workflow_dispatch:              # Permite rodar manualmente pelo GitHub

permissions:
  contents: write

# Avoid two runs overlapping and racing on the vagas_gupy.db push
concurrency:
  group: vagas-bot
  cancel-in-progress: false

jobs:
  buscar-vagas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
        run: python main.py

      - name: Salvar banco de dados atualizado
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Vagas Bot"
          git add vagas_gupy.db
          git diff --staged --quiet || git commit -m "chore: atualiza vagas_gupy.db [skip ci]"
          # Pick up commits pushed to main while the bot was running, otherwise the push is rejected
          git pull --rebase
          git push
