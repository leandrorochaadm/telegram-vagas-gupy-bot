name: Vagas Bot

on:
  # Main schedule lives in scheduler/ (Cloudflare Worker vagas-bot-scheduler):
  # it calls workflow_dispatch on time, since GitHub's own
  # schedule is delayed/dropped.
  # This sparse cron is only a fallback in case the Worker stops (e.g. expired
  # token); extra runs are harmless because sent jobs are deduplicated in the PocketBase database.
  schedule:
    - cron: '23 12,16,20 * * *'   # Reserva: 9h23, 13h23 e 17h23 (BRT), todo dia
  workflow_dispatch:              # Permite rodar manualmente pelo GitHub

permissions:
  contents: read

# Avoid two runs overlapping and sending the same queued jobs twice
concurrency:
  group: vagas-bot
  cancel-in-progress: false

jobs:
  # One job per site, in parallel: a site that hangs or fails does not stop the others
  buscar-vagas:
    runs-on: ubuntu-latest
    # Safety net only: the search itself is cut 14 min after the job starts (see "Executar bot")
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [gupy, linkedin, linkedin_posts, inhire, solides, remotar, web]
    env:
      HAS_LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT != '' }}

    steps:
      # The 15 min window counts from here, setup included
      - name: Marcar início
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # The browser build follows the playwright pin in requirements.txt, so its hash keys the cache
      - name: Restaurar navegador do Playwright
        id: playwright-cache
        if: matrix.source == 'linkedin_posts' && env.HAS_LINKEDIN_LI_AT == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Headless browser for the logged-in LinkedIn posts search (LINKEDIN_LI_AT).
      # Only when the secret exists; the step gets a true/false flag, never the cookie.
      # If it fails the bot still runs: posts fall back to the Brave search.
      - name: Instalar navegador do Playwright
        id: playwright-install
        if: matrix.source == 'linkedin_posts' && env.HAS_LINKEDIN_LI_AT == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        # The runner image already ships the libs Chromium needs; install-deps only adds optional
        # fonts, and the Azure apt mirror sometimes takes minutes to serve them (step timed out).
        # So apt runs only when the browser fails to launch.
        run: |
          [ "$PLAYWRIGHT_CACHE_HIT" = 'true' ] || python -m playwright install chromium
          launch='from playwright.sync_api import sync_playwright
          with sync_playwright() as p: p.chromium.launch().close()'
          python -c "$launch" || { python -m playwright install-deps chromium && python -c "$launch"; }

      # Saved only after a full install that succeeded (a half-downloaded folder never gets cached).
      # actions/cache@v6 would save at job end even when the install failed, hence restore + save.
      - name: Guardar navegador do Playwright
        if: matrix.source == 'linkedin_posts' && env.HAS_LINKEDIN_LI_AT == 'true' && steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-install.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Reuse one WARP account across runs instead of registering a new one every 30 min
      # (Cloudflare rate-limits registrations). Bump the key to force a fresh account.
      - name: Restaurar conta WARP
        if: matrix.source == 'programathor'
        uses: actions/cache@v6
        with:
          path: ~/.wgcf
          key: wgcf-account-v1

      - name: Conectar Cloudflare WARP
        if: matrix.source == 'programathor'
        # ProgramaThor's Cloudflare blocks GitHub's datacenter IPs (403). wgcf registers a free
        # WARP account and wireproxy exposes it as a local SOCKS proxy (userspace, no apt:
        # installing the official cloudflare-warp package hangs on the runners).
        # Only the ProgramaThor requests use it. If it fails the bot still runs without a proxy.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Pinned checksums: these binaries keep running while the bot step holds the secrets.
          curl -fsSL -o "$RUNNER_TEMP/wgcf" https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64
          curl -fsSL -o "$RUNNER_TEMP/wireproxy.tgz" https://github.com/whyvl/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          sha256sum -c - <<EOF
          01614e38c0eb5f3405232e71cfaf02d64d4809e4988ad8f5a8071af16d193405  $RUNNER_TEMP/wgcf
          e88c1d090740373fc606c1bafd81d9a5eadc642cce5667616e20e9d7a444f51c  $RUNNER_TEMP/wireproxy.tgz
          EOF
          tar -xzf "$RUNNER_TEMP/wireproxy.tgz" -C "$RUNNER_TEMP" wireproxy
          chmod +x "$RUNNER_TEMP/wgcf" "$RUNNER_TEMP/wireproxy"
          mkdir -p ~/.wgcf && cd ~/.wgcf
          # Public repo: keep account/device ids out of the log
          register() { rm -f wgcf-account.toml && "$RUNNER_TEMP/wgcf" register --accept-tos >/dev/null; }
          [ -f wgcf-account.toml ] || register
          # A cached account Cloudflare revoked: register a fresh one for this run
          "$RUNNER_TEMP/wgcf" generate >/dev/null || { register && "$RUNNER_TEMP/wgcf" generate >/dev/null; }
          printf 'WGConfig = %s/wgcf-profile.conf\n\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' "$PWD" > wireproxy.conf
          # Some runs never get a WireGuard handshake back from the default endpoint:
          # fall back to other WARP endpoint IPs/ports before giving up.
          # engage.cloudflareclient.com resolves to 162.159.192.1, so that IP is only retried on other ports.
          trace=""
          for endpoint in engage.cloudflareclient.com:2408 162.159.193.1:2408 162.159.192.1:500 162.159.193.1:4500 162.159.192.1:1701; do
            sed -i "s/^Endpoint = .*/Endpoint = $endpoint/" wgcf-profile.conf
            grep -qx "Endpoint = $endpoint" wgcf-profile.conf
            nohup "$RUNNER_TEMP/wireproxy" -c wireproxy.conf > wireproxy.log 2>&1 &
            pid=$!
            if trace=$(timeout 15 bash -c 'until curl -fsS --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace; do sleep 1; done'); then
              echo "endpoint=$endpoint"
              break
            fi
            echo "No handshake via $endpoint"
            # wireproxy may have already exited; under bash -e a failed kill would end the step
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            trace=""
          done
          [ -n "$trace" ] || { cat wireproxy.log; exit 1; }
          grep -E '^(ip|warp)=' <<<"$trace"
          grep -qx 'warp=on' <<<"$trace"
          echo "SCRAPER_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Executar bot
        id: run
        timeout-minutes: 15
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          PB_URL: ${{ vars.PB_URL }}
          PB_BOT_EMAIL: ${{ secrets.PB_BOT_EMAIL }}
          PB_BOT_PASSWORD: ${{ secrets.PB_BOT_PASSWORD }}
        # Search until 14 min after the job start, so the sending job starts ~15 min
        # after the run. Jobs are queued in the database as they are
        # found: a search cut short still has the ones it found sent.
        run: |
          remaining=$(( JOB_START + 14 * 60 - $(date +%s) ))
          [ "$remaining" -gt 0 ] || { echo "No time left after setup"; exit 1; }
          timeout "$remaining" python main.py --source ${{ matrix.source }}

      # Hung (timeout), crashed or never started (setup failed): the final alert says this site stopped early
      - name: Anotar busca interrompida
        if: always() && steps.run.outcome != 'success'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          PB_URL: ${{ vars.PB_URL }}
          PB_BOT_EMAIL: ${{ secrets.PB_BOT_EMAIL }}
          PB_BOT_PASSWORD: ${{ secrets.PB_BOT_PASSWORD }}
        run: python main.py --failed ${{ matrix.source }}

  # Runs last: sends every queued job (the same job from two sites goes out once) and one alert for all sites
  finalizar:
    needs: buscar-vagas
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # A job that does not reach the group stays queued for the next run
      - name: Enviar vagas
        if: always()
        timeout-minutes: 15
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          PB_URL: ${{ vars.PB_URL }}
          PB_BOT_EMAIL: ${{ secrets.PB_BOT_EMAIL }}
          PB_BOT_PASSWORD: ${{ secrets.PB_BOT_PASSWORD }}
        run: python main.py --send-jobs

      - name: Enviar avisos
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_GRUPO: ${{ secrets.CHAT_ID_GRUPO }}
          PB_URL: ${{ vars.PB_URL }}
          PB_BOT_EMAIL: ${{ secrets.PB_BOT_EMAIL }}
          PB_BOT_PASSWORD: ${{ secrets.PB_BOT_PASSWORD }}
        run: python main.py --send-alerts
